name: Generate fanfictions updates

on:
  push:
    paths:
      - 'hubkai/fanfictions/**'

jobs:
  generate-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run update script
        working-directory: hubkai/scripts
        run: node generate-updates.js

      - name: Commit and push updated JSON
        working-directory: hubkai
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/fanfictions-updates.json
          git commit -m "Update fanfictions-updates.json [skip ci]" || echo "No changes to commit"
          git push
