name: Generate fanfiction updates

on:
  push:
    paths:
      - "fanfictions/**"

jobs:
  generate_updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Generate updates JSON
        run: node scripts/generate-updates.js

      - name: Commit updates
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update fanfiction updates JSON"
          file_pattern: "public/fanfictions-updates.json"
