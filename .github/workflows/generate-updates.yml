name: Generate fanfictions updates

on:
  push:
    paths:
      - 'kaishouri/fanfictions/**'

jobs:
  generate-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run update script
        working-directory: kaishouri/scripts
        run: node generate-updates.js

      - name: Commit and push updated JSON
        working-directory: kaishouri
        run: |
          git config user.name "Kaienka"
          git config user.email "wolanin4u@gmail.com"
          git add public/fanfictions-updates.json
          git commit -m "Update fanfictions-updates.json [skip ci]" || echo "No changes to commit"
          git push
